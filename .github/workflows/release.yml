name: Release

# Pushing a vX.Y.Z tag builds everything from source, signs the update
# manifest and opens a DRAFT release. Nothing reaches users until a
# maintainer reviews the draft and publishes it by hand. Manual runs stage
# the signed files in Actions without editing a public release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and sign (without v)'
        required: true
        type: string
      notes:
        description: 'Plain-text notes for the signed update manifest'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOOS: windows
  GOARCH: amd64
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !github.event.forced
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release
    steps:
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = 'v' + $env:RELEASE_VERSION }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Version must be MAJOR.MINOR.PATCH[-pre].' }
          "version=$($Matches[1])" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require update signing configuration
        shell: pwsh
        env:
          ODDWARD_UPDATE_KEY: ${{ secrets.ODDWARD_UPDATE_KEY }}
        run: |
          if (!$env:ODDWARD_UPDATE_KEY) { throw 'Secret ODDWARD_UPDATE_KEY is not set; run scripts/new-update-key.ps1 first.' }
          if (Select-String -Path internal/buildinfo/buildinfo.go -Pattern 'UpdatePublicKey = ""' -Quiet) {
            throw 'internal/buildinfo.UpdatePublicKey is empty; run scripts/new-update-key.ps1 and commit the public key.'
          }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Synthetic tests
        run: go test -count=1 ./...
      - name: Install Inno Setup
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Prepare signed release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $text = $env:RELEASE_NOTES
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
            if ($ref.object.type -eq 'tag') { $text = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" | ConvertFrom-Json).message }
            $text = ($text -replace '(?s)-----BEGIN (PGP|SSH) SIGNATURE-----.*$', '').Trim()
          }
          if (!$text) { $text = "Oddward ${{ steps.version.outputs.version }}" }
          Set-Content -LiteralPath $notes -Value $text -Encoding utf8NoBOM
          "ODDWARD_NOTES=$notes" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      # Builds the pure Go + MyGo Native UI launcher, the stub, the
      # signed update package and the installer (no .NET SDK required).
      - name: Build, sign and package
        shell: pwsh
        env:
          ODDWARD_UPDATE_KEY: ${{ secrets.ODDWARD_UPDATE_KEY }}
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.version }}' -Notes $env:ODDWARD_NOTES
      - name: Write release checksums
        shell: pwsh
        run: |
          $publish = 'artifacts/release/${{ steps.version.outputs.version }}/publish'
          Get-ChildItem -LiteralPath $publish -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath (Join-Path $publish 'SHA256SUMS.txt') -Encoding utf8NoBOM
      - name: Stage signed release files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oddward-${{ steps.version.outputs.version }}-signed
          path: artifacts/release/${{ steps.version.outputs.version }}/publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Create draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem "artifacts/release/$version/publish" -File | ForEach-Object FullName
          $pre = @()
          if ($version.Contains('-')) { $pre = @('--prerelease') }
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag @pre --title "Oddward $version" --notes-file $env:ODDWARD_NOTES @files
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
