name: 功能建议
description: 新功能或对现有体验的改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        以下需求不会被接受：绕过登录、认证或反作弊，向游戏注入，打包官方素材或二进制，改用 WebView/Electron。详见 CONTRIBUTING.md。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
